services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumodealsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2016"
    ports:
      - "5432:5432"
    volumes:
      - lumo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumodealsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lumo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumo_local
      MINIO_ROOT_PASSWORD: lumo_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lumo_minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  lumo_postgres_data:
  lumo_redis_data:
  lumo_minio_data:
